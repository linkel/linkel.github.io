<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <!-- Thanks for checking my source out. Have a great day! -->
    <meta charset="utf-8" />
    <title>{TITLE}</title>
    <meta name="description" content="{TITLE}" />
    <meta name="author" content="Kelly Huntlin" />
    <meta
      name="keywords"
      content="Kelly, Kelly Huntlin, R&D, Programming, Software Development, Software Engineering"
    />
    <meta property="og:title" content="{TITLE}" />
    <meta property="og:description" content="{TITLE}" />
    <meta property="og:image" content="http://kellylin.me/images/logo.jpg" />
    <meta property="og:url" content="http://kellylin.me" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="icon" type="image/png" href="../images/logo.png" />
    <script src="../js/theme.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="tab-bar">
        <div class="logo-tab">
          <a href="../index.html"><img src="../images/logo.png" alt="Kelly Huntlin" /></a>
        </div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="../blog.html" class="active">Blog</a>
          <a href="../talks.html">Talks</a>
          <a href="../about.html">About</a>
        </nav>
        <div class="spacer"></div>
        <div class="theme-toggle">
          <button id="theme-toggle" aria-label="Switch to dark mode">dark_mode</button>
        </div>
      </div>

      <div class="editor-layout">
        <div class="gutter" aria-hidden="true">
          <div class="gutter-line">1</div>
          <div class="gutter-line">2</div>
          <div class="gutter-line">3</div>
          <div class="gutter-line">4</div>
          <div class="gutter-line">5</div>
          <div class="gutter-line">6</div>
          <div class="gutter-line">7</div>
          <div class="gutter-line">8</div>
          <div class="gutter-line">9</div>
          <div class="gutter-line">10</div>
        </div>

        <div class="content-area">
          <div class="blog-body fade-in">
            <p class="blog-date">{DATE}</p>
            {BODY}
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
